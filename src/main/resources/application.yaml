server:
  port: 5000
  address: 0.0.0.0  # Bind to all interfaces để mobile app có thể connect

app:
  api-prefix: /v1
  # ✅ THÊM ngrok URL và patterns
  allowed-origins: >
    http://localhost:8081,
    http://localhost:5173,
    http://localhost:3000,
    http://localhost:19006,
    http://10.0.2.2:5000,
    http://10.0.2.2:8081,
  identity-service:
    url: http://localhost:5001/identity

socketio:
  host: ${SOCKETIO_HOST:0.0.0.0}
  port: ${SOCKETIO_PORT:9092}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # ❌ XÓA globalcors config này đi - sẽ dùng CorsWebFilter bean thay thế
      # globalcors:
      #   corsConfigurations:
      #     '[/**]':
      #       allowedOriginPatterns:
      #         - "*"
      #       allowedMethods:
      #         - GET
      #         - POST
      #         - PUT
      #         - DELETE
      #         - OPTIONS
      #         - PATCH
      #       allowedHeaders:
      #         - "*"
      #       allowCredentials: true
      #       maxAge: 3600

      routes:
        - id: identity_service
          uri: http://localhost:5001
          predicates:
            - Path=${app.api-prefix}/identity/**
          filters:
            - StripPrefix=1
        - id: profile_service
          uri: http://localhost:5002
          predicates:
            - Path=${app.api-prefix}/profile/users/**
          filters:
            - StripPrefix=1
        - id: notification_service
          uri: http://localhost:5003
          predicates:
            - Path=${app.api-prefix}/notification/**
          filters:
            - StripPrefix=1
        - id: post_service
          uri: http://localhost:5004
          predicates:
            - Path=${app.api-prefix}/post/**
          filters:
            - StripPrefix=1
        - id: identity_post_comment
          uri: http://localhost:5001
          predicates:
            - Path=${app.api-prefix}/post/comment/**
          filters:
            - StripPrefix=2
        - id: identity_post_like
          uri: http://localhost:5001
          predicates:
            - Path=${app.api-prefix}/post/like/**
          filters:
            - StripPrefix=2
        - id: identity_post_share
          uri: http://localhost:5001
          predicates:
            - Path=${app.api-prefix}/post/share/**
          filters:
            - StripPrefix=2
        - id: file_service
          uri: http://localhost:5005
          predicates:
            - Path=${app.api-prefix}/file/**
          filters:
            - StripPrefix=1
        - id: chat_service
          uri: http://localhost:5010
          predicates:
            - Path=${app.api-prefix}/chat/**
          filters:
            - StripPrefix=1
        - id: relationship_service
          uri: http://localhost:5007
          predicates:
            - Path=${app.api-prefix}/relationship/**
          filters:
            - StripPrefix=1